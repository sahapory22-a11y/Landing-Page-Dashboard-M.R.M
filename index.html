  <!-- Main Application Script (ES Module) -->
  <script type="module">
    // =========================================================================
    // 1. KONFIGURASI APLIKASI & SAKLAR DUAL-MODE (WAJIB DI ATAS)
    // =========================================================================
    const IS_PREVIEW = false; // Mode Produksi aktif: terhubung murni ke Firebase Firestore tanpa data dummy

    // PASTE FIREBASE CONFIG ANDA DI SINI
    const firebaseConfig = {
  apiKey: "AIzaSyBlHgG3rLyNX6nVNNYl_KsHFZvwFiNjB1g",
  authDomain: "dashboard-landing-page.firebaseapp.com",
  projectId: "dashboard-landing-page",
  storageBucket: "dashboard-landing-page.firebasestorage.app",
  messagingSenderId: "750839040661",
  appId: "1:750839040661:web:63c199184b3d8a2fef299c"
    };

    // =========================================================================
    // 2. INISIALISASI PWA SERVICE WORKER VIA BLOB (SINGLE-FILE)
    // =========================================================================
    if ('serviceWorker' in navigator) {
      try {
        const swCode = [
          "const CACHE_NAME = 'marssyedudigital-pwa-v1';",
          "self.addEventListener('install', (event) => { self.skipWaiting(); });",
          "self.addEventListener('activate', (event) => { event.waitUntil(clients.claim()); });",
          "self.addEventListener('fetch', (event) => { event.respondWith(fetch(event.request).catch(() => new Response('Offline mode'))); });"
        ].join("\n");
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      } catch (e) {
        // Abaikan jika browser membatasi blob SW
      }
    }

    // =========================================================================
    // 3. IMPORT FIREBASE SDK (PRODUKSI FIREBASE AUTH & FIRESTORE)
    // =========================================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      addDoc,
      deleteDoc,
      query,
      where
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const isFirebaseConfigured = Boolean(
      firebaseConfig &&
      firebaseConfig.apiKey &&
      firebaseConfig.apiKey !== "API_KEY_ANDA" &&
      firebaseConfig.projectId &&
      firebaseConfig.projectId !== "PROJECT_ID"
    );

    let fbApp = null;
    let fbAuth = null;
    let fbDb = null;

    if (!IS_PREVIEW && isFirebaseConfigured) {
      try {
        fbApp = initializeApp(firebaseConfig);
        fbAuth = getAuth(fbApp);
        fbDb = getFirestore(fbApp);
      } catch (err) {
        console.error("Gagal inisialisasi Firebase:", err);
      }
    }

    // =========================================================================
    // 4. STATE APLIKASI BERSIH (ZERO DUMMY DATA — SIAP INPUT ADMIN BARU)
    // =========================================================================
    const DEFAULT_SETTINGS = {
      schoolName: "",
      agencyName: "DINAS PENDIDIKAN DAN KEBUDAYAAN",
      npsn: "",
      address: "",
      academicYear: "2026/2027",
      semester: "Ganjil",
      teacherName: "",
      teacherNip: "",
      principalName: "",
      principalNip: "",
      kktp: 75,
      kktpX: 75,
      kktpXI: 75,
      kktpXII: 75,
      agencyLogoUrl: "",
      schoolLogoUrl: ""
    };

    function getKktpForClass(classId) {
      const s = state.data.settings;
      const fallback = Number(s.kktp ?? 75);
      const cls = state.data.classes.find(c => c.id === classId);
      const grade = String(cls?.gradeLevel || "").toUpperCase().trim();
      if (grade === "X") return Number(s.kktpX ?? fallback);
      if (grade === "XI") return Number(s.kktpXI ?? fallback);
      if (grade === "XII") return Number(s.kktpXII ?? fallback);
      return fallback;
    }

    const state = {
      role: null, // 'teacher' | 'student' | null (Landing Page)
      currentUser: null,
      activeMenu: "dashboard",
      searchQuery: "",
      selectedClassFilter: "",
      attendanceDate: new Date().toISOString().slice(0, 10),
      attendanceTimeSlot: "",
      attendanceMeetingNo: 1,
      attendanceTab: "input",
      gradesTab: "input",
      cbtSelectedExamId: "",
      cbtMonitorExamId: "",
      reportClassFilter: "",
      reportExamFilter: "",
      activeExamSession: null,
      isLoading: false,
      data: {
        settings: { ...DEFAULT_SETTINGS },
        classes: [],
        students: [],
        schedules: [],
        journals: [],
        attendance: {},
        grades: {},
        wali_guidance: [],
        cbt_exams: [],
        cbt_questions: [],
        cbt_submissions: {}
      }
    };

    // =========================================================================
    // 5. FUNGSI UTILITAS UI, FORMAT TANGGAL, TOAST & MODAL
    // =========================================================================
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDateIndo(dateStr) {
      if (!dateStr) return "-";
      const months = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];
      const parts = String(dateStr).split("-");
      if (parts.length !== 3) return String(dateStr);
      const y = parts[0];
      const m = parseInt(parts[1], 10) - 1;
      const d = parseInt(parts[2], 10);
      if (isNaN(m) || isNaN(d) || !months[m]) return String(dateStr);
      return `${d} ${months[m]} ${y}`;
    }

    function getDayNameIndo(dateStr) {
      if (!dateStr) return "Senin";
      const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const parts = String(dateStr).split("-");
      if (parts.length === 3) {
        const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        if (!isNaN(dt.getTime())) return days[dt.getDay()];
      }
      const dt = new Date(dateStr);
      return isNaN(dt.getTime()) ? "Senin" : days[dt.getDay()];
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const colors = {
        success: "bg-emerald-600 text-white border-emerald-500",
        error: "bg-rose-600 text-white border-rose-500",
        warning: "bg-amber-500 text-white border-amber-400",
        info: "bg-espresso text-white border-espresso/80"
      };
      const icons = {
        success: "check-circle-2",
        error: "alert-octagon",
        warning: "alert-triangle",
        info: "info"
      };
      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-lg border text-xs font-bold transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `
        <i data-lucide="${icons[type] || icons.info}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openModal(title, bodyHtml, maxWidthClass = "max-w-lg") {
      const modalRoot = document.getElementById("modal-root");
      if (!modalRoot) return;
      modalRoot.innerHTML = `
        <div class="bg-white rounded-[28px] w-full ${maxWidthClass} shadow-clayLg border border-roseBorder overflow-hidden animate-view max-h-[90vh] flex flex-col">
          <div class="px-6 py-4 bg-peach/50 border-b border-roseBorder flex items-center justify-between gap-3 shrink-0">
            <h3 class="text-base font-extrabold text-espresso truncate">${escapeHtml(title)}</h3>
            <button type="button" onclick="window.appActions.closeModal()" class="w-8 h-8 rounded-full bg-white hover:bg-salmon hover:text-white text-taupe flex items-center justify-center transition shrink-0">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="p-6 overflow-y-auto flex-1">
            ${bodyHtml}
          </div>
        </div>
      `;
      modalRoot.classList.remove("hidden");
      modalRoot.classList.add("flex");
      if (window.lucide) window.lucide.createIcons();
    }

    function closeModal() {
      const modalRoot = document.getElementById("modal-root");
      if (!modalRoot) return;
      modalRoot.classList.add("hidden");
      modalRoot.classList.remove("flex");
      modalRoot.innerHTML = "";
    }

    function openConfirmModal(title, message, onConfirm) {
      openModal(title, `
        <div class="space-y-4">
          <p class="text-xs sm:text-sm text-taupe leading-relaxed">${escapeHtml(message)}</p>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="window.appActions.closeModal()" class="px-5 py-2.5 rounded-full bg-blush text-taupe font-bold text-xs">Batal</button>
            <button type="button" id="btn-confirm-modal-ok" class="px-6 py-2.5 rounded-full bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-xs shadow-sm">Ya, Lanjutkan</button>
          </div>
        </div>
      `, "max-w-sm");

      const btnOk = document.getElementById("btn-confirm-modal-ok");
      if (btnOk) {
        btnOk.onclick = async () => {
          closeModal();
          if (typeof onConfirm === "function") {
            await onConfirm();
          }
        };
      }
    }

    // =========================================================================
    // 6. LAPISAN DATA FIREBASE FIRESTORE (PRODUKSI MURNI)
    // =========================================================================
    async function dbLoadAllDataForTeacher() {
      if (!fbDb) return;
      state.isLoading = true;
      renderApp();
      try {
        const [
          setSnap, clsSnap, stdSnap, schSnap, jrnSnap,
          attSnap, grdSnap, walSnap, exmSnap, qstSnap, subSnap
        ] = await Promise.all([
          getDoc(doc(fbDb, "settings", "school_profile")),
          getDocs(collection(fbDb, "classes")),
          getDocs(collection(fbDb, "students")),
          getDocs(collection(fbDb, "schedules")),
          getDocs(collection(fbDb, "journals")),
          getDocs(collection(fbDb, "attendance")),
          getDocs(collection(fbDb, "grades")),
          getDocs(collection(fbDb, "wali_guidance")),
          getDocs(collection(fbDb, "cbt_exams")),
          getDocs(collection(fbDb, "cbt_questions")),
          getDocs(collection(fbDb, "cbt_submissions"))
        ]);

        if (setSnap.exists()) {
          state.data.settings = { ...DEFAULT_SETTINGS, ...setSnap.data() };
        }
        state.data.classes = clsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.students = stdSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.schedules = schSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.journals = jrnSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const attMap = {};
        attSnap.docs.forEach(d => { attMap[d.id] = { id: d.id, ...d.data() }; });
        state.data.attendance = attMap;

        const grdMap = {};
        grdSnap.docs.forEach(d => { grdMap[d.id] = { id: d.id, ...d.data() }; });
        state.data.grades = grdMap;

        state.data.wali_guidance = walSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.cbt_exams = exmSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.cbt_questions = qstSnap.docs.map(d => ({ id: d.id, ...d.data() }));

        const subMap = {};
        subSnap.docs.forEach(d => { subMap[d.id] = { id: d.id, ...d.data() }; });
        state.data.cbt_submissions = subMap;

        if (!state.cbtSelectedExamId && state.data.cbt_exams.length > 0) {
          state.cbtSelectedExamId = state.data.cbt_exams[0].id;
        }
        if (!state.cbtMonitorExamId && state.data.cbt_exams.length > 0) {
          state.cbtMonitorExamId = state.data.cbt_exams[0].id;
        }
      } catch (err) {
        console.error("Gagal memuat data Firestore:", err);
        showToast("Gagal memuat data dari Firestore: " + err.message, "error");
      } finally {
        state.isLoading = false;
        renderApp();
      }
    }

    async function dbLoadDataForStudent(student) {
      if (!fbDb) return;
      try {
        const [setSnap, clsSnap, exmSnap, qstSnap, subSnap] = await Promise.all([
          getDoc(doc(fbDb, "settings", "school_profile")),
          getDocs(collection(fbDb, "classes")),
          getDocs(collection(fbDb, "cbt_exams")),
          getDocs(collection(fbDb, "cbt_questions")),
          getDocs(query(collection(fbDb, "cbt_submissions"), where("studentId", "==", student.id)))
        ]);
        if (setSnap.exists()) {
          state.data.settings = { ...DEFAULT_SETTINGS, ...setSnap.data() };
        }
        state.data.classes = clsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.cbt_exams = exmSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.data.cbt_questions = qstSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const subMap = {};
        subSnap.docs.forEach(d => { subMap[d.id] = { id: d.id, ...d.data() }; });
        state.data.cbt_submissions = subMap;
      } catch (err) {
        console.error("Gagal memuat data ujian siswa:", err);
      }
    }

    async function dbSaveDoc(colName, docId, payload, isMapCollection = false) {
      if (!fbDb) throw new Error("Firebase belum terkonfigurasi. Isi firebaseConfig terlebih dahulu.");
      if (docId) {
        await setDoc(doc(fbDb, colName, docId), payload, { merge: true });
        const record = { id: docId, ...payload };
        if (colName === "settings") {
          state.data.settings = { ...state.data.settings, ...payload };
        } else if (isMapCollection) {
          state.data[colName][docId] = record;
        } else {
          const arr = state.data[colName];
          const idx = arr.findIndex(item => item.id === docId);
          if (idx >= 0) arr[idx] = record;
          else arr.unshift(record);
        }
        return docId;
      } else {
        const ref = await addDoc(collection(fbDb, colName), payload);
        const record = { id: ref.id, ...payload };
        state.data[colName].unshift(record);
        return ref.id;
      }
    }

    async function dbDeleteDoc(colName, docId, isMapCollection = false) {
      if (!fbDb) throw new Error("Firebase belum terkonfigurasi. Isi firebaseConfig terlebih dahulu.");
      await deleteDoc(doc(fbDb, colName, docId));
      if (isMapCollection) {
        delete state.data[colName][docId];
      } else {
        state.data[colName] = state.data[colName].filter(item => item.id !== docId);
      }
    }

    // =========================================================================
    // 7. MESIN CETAK PDF A4 RESMI (ISOLATED IFRAME PRINT + DIRECT PDF DOWNLOAD)
    // =========================================================================
    function buildOfficialPrintHtml(title, subtitle, bodyContentHtml) {
      const s = state.data.settings;
      const todayIndo = formatDateIndo(new Date().toISOString().slice(0, 10));

    function triggerCleanIframePrint(fullHtml, docTitle = "Dokumen_MarssyEduDigital") {
      try {
        const oldFrame = document.getElementById("eduluna-print-frame");
        if (oldFrame) oldFrame.remove();

        const iframe = document.createElement("iframe");
        iframe.id = "eduluna-print-frame";
        iframe.style.position = "fixed";
        iframe.style.right = "0";
        iframe.style.bottom = "0";
        iframe.style.width = "0";
        iframe.style.height = "0";
        iframe.style.border = "0";
        document.body.appendChild(iframe);

        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8" />
            <title>${escapeHtml(docTitle)}</title>
            <style>
              @page { size: A4; margin: 12mm; }
              body { font-family: 'Times New Roman', Times, serif; color: #000; margin: 0; padding: 0; }
              table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 14px; }
              thead { display: table-header-group; }
              tr { page-break-inside: avoid; }
              th, td { border: 1px solid #222; padding: 5px 7px; font-size: 9.5pt; vertical-align: top; }
              th { background: #f3f4f6; font-weight: bold; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
              .pdf-summary-box { border: 1px solid #444; background: #fafafa; padding: 8px 10px; margin-bottom: 10px; font-size: 9.5pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
              .pdf-section-break { page-break-before: always; margin-top: 8px; }
            </style>
          </head>
          <body>${fullHtml}</body>
          </html>
        `);
        doc.close();

        setTimeout(() => {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        }, 350);
      } catch (err) {
        const area = document.getElementById("print-area");
        if (area) {
          area.innerHTML = fullHtml;
          window.print();
        }
      }
    }

    function downloadDirectPdfFile(fullHtml, fileName = "Laporan_MarssyEduDigital.pdf") {
      if (typeof window.html2pdf === "undefined") {
        showToast("Pustaka unduh PDF sedang dimuat, silakan gunakan tombol Cetak Printer.", "warning");
        return;
      }
      showToast("Menyiapkan file PDF...", "info");
      const container = document.createElement("div");
      container.style.width = "190mm";
      container.style.padding = "6mm";
      container.style.background = "#ffffff";
      container.innerHTML = `
        <style>
          table { width: 100%; border-collapse: collapse; margin-top: 8px; margin-bottom: 14px; }
          th, td { border: 1px solid #222; padding: 5px 7px; font-size: 9.5pt; vertical-align: top; }
          th { background: #f3f4f6; font-weight: bold; text-align: center; }
          .pdf-summary-box { border: 1px solid #444; background: #fafafa; padding: 8px 10px; margin-bottom: 10px; font-size: 9.5pt; }
          .pdf-section-break { page-break-before: always; margin-top: 8px; }
        </style>
        ${fullHtml}
      `;
      document.body.appendChild(container);

      const opt = {
        margin: [10, 10, 10, 10],
        filename: fileName.endsWith(".pdf") ? fileName : `${fileName}.pdf`,
        image: { type: "jpeg", quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
      };

      window.html2pdf()
        .set(opt)
        .from(container)
        .save()
        .then(() => {
          container.remove();
          showToast("File PDF berhasil diunduh!", "success");
        })
        .catch(() => {
          container.remove();
          showToast("Gagal mengunduh PDF langsung, silakan klik Cetak / Simpan PDF.", "error");
        });
    }

    function openAuthModal(initialTab = "teacher") {
      const renderAuthContent = (tab) => `
        <div class="space-y-5">
          <div class="grid grid-cols-2 p-1.5 bg-blush rounded-full border border-roseBorder">
            <button type="button" id="auth-tab-teacher" class="py-2 rounded-full text-xs font-extrabold transition ${

            }">

            </button>
            <button type="button" id="auth-tab-student" class="py-2 rounded-full text-xs font-extrabold transition ${
              tab === "student" ? "bg-periwinkleDark text-white shadow-sm" : "text-taupe hover:text-espresso"
            }">
              Login Peserta CBT
            </button>
          </div>

          ${tab === "teacher" ? `
            <form id="form-login-teacher" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-espresso mb-1.5">Email Guru / Admin</label>
                <input type="email" id="login-teacher-email" required placeholder="Masukkan email admin terdaftar" class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/50 text-sm focus:outline-none focus:border-salmon" />
              </div>
              <div>
                <label class="block text-xs font-bold text-espresso mb-1.5">Kata Sandi</label>
                <input type="password" id="login-teacher-pass" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/50 text-sm focus:outline-none focus:border-salmon" />
              </div>
              <button type="submit" id="btn-submit-teacher" class="w-full py-3.5 rounded-full bg-coral hover:bg-coralDark text-white font-extrabold text-sm shadow-pill transition flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i> Masuk ke Dashboard Guru
              </button>
            </form>
          ` : `
            <form id="form-login-student" class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-espresso mb-1.5">Username / NIS Peserta</label>
                <input type="text" id="login-student-user" required placeholder="Masukkan Username atau NIS" class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/50 text-sm focus:outline-none focus:border-periwinkleDark" />
              </div>
              <div>
                <label class="block text-xs font-bold text-espresso mb-1.5">Password / PIN Ujian</label>
                <input type="password" id="login-student-pass" required placeholder="Masukkan Password / PIN" class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/50 text-sm focus:outline-none focus:border-periwinkleDark" />
              </div>
              <button type="submit" id="btn-submit-student" class="w-full py-3.5 rounded-full bg-periwinkleDark hover:bg-periwinkle text-white font-extrabold text-sm shadow-clayLg transition flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4"></i> Masuk Ruang Ujian CBT
              </button>
            </form>
          `}
        </div>
      `;

      const bindAuthEvents = (tab) => {
        const tabT = document.getElementById("auth-tab-teacher");
        const tabS = document.getElementById("auth-tab-student");
        if (tabT) tabT.onclick = () => {
          openModal("Akses Portal MarssyEduDigital", renderAuthContent("teacher"), "max-w-md");
          bindAuthEvents("teacher");
        };
        if (tabS) tabS.onclick = () => {
          openModal("Akses Portal MarssyEduDigital", renderAuthContent("student"), "max-w-md");
          bindAuthEvents("student");
        };

        if (tab === "teacher") {
          const form = document.getElementById("form-login-teacher");
          if (form) {
            form.onsubmit = async (e) => {
              e.preventDefault();
              const email = document.getElementById("login-teacher-email").value.trim();
              const pass = document.getElementById("login-teacher-pass").value.trim();

              if (!fbAuth || !isFirebaseConfigured) {
                showToast("Konfigurasi Firebase belum diisi pada kode index.html.", "error");
                return;
              }
              try {
                const btn = document.getElementById("btn-submit-teacher");
                if (btn) btn.disabled = true;
                const cred = await signInWithEmailAndPassword(fbAuth, email, pass);
                state.role = "teacher";
                state.currentUser = { uid: cred.user.uid, email: cred.user.email };
                closeModal();
                showToast("Login Guru berhasil!", "success");
                await dbLoadAllDataForTeacher();
              } catch (err) {
                showToast("Login gagal: " + err.message, "error");
                const btn = document.getElementById("btn-submit-teacher");
                if (btn) btn.disabled = false;
              }
            };
          }
        } else {
          const form = document.getElementById("form-login-student");
          if (form) {
            form.onsubmit = async (e) => {
              e.preventDefault();
              const uname = document.getElementById("login-student-user").value.trim();
              const pass = document.getElementById("login-student-pass").value.trim();

              if (!fbDb || !isFirebaseConfigured) {
                showToast("Konfigurasi Firebase belum diisi pada kode index.html.", "error");
                return;
              }
              try {
                const btn = document.getElementById("btn-submit-student");
                if (btn) btn.disabled = true;
                const q = query(collection(fbDb, "students"), where("username", "==", uname));
                const snap = await getDocs(q);
                let matched = null;
                snap.forEach(d => {
                  const data = d.data();
                  if (String(data.password) === pass) {
                    matched = { id: d.id, ...data };
                  }
                });
                if (!matched) {
                  const qNis = query(collection(fbDb, "students"), where("nis", "==", uname));
                  const snapNis = await getDocs(qNis);
                  snapNis.forEach(d => {
                    const data = d.data();
                    if (String(data.password) === pass) {
                      matched = { id: d.id, ...data };
                    }
                  });
                }

                if (matched) {
                  state.role = "student";
                  state.currentUser = matched;
                  closeModal();
                  await dbLoadDataForStudent(matched);
                  showToast(`Selamat datang, ${matched.name}!`, "success");
                  renderApp();
                } else {
                  showToast("Username/NIS atau Password/PIN peserta tidak valid.", "error");
                  if (btn) btn.disabled = false;
                }
              } catch (err) {
                showToast("Gagal memvalidasi akun peserta: " + err.message, "error");
                const btn = document.getElementById("btn-submit-student");
                if (btn) btn.disabled = false;
              }
            };
          }
        }
      };

      openModal("Akses Portal MarssyEduDigital", renderAuthContent(initialTab), "max-w-md");
      bindAuthEvents(initialTab);
    }

    async function handleLogout() {
      if (state.activeExamSession) {
        showToast("Selesaikan dan kirim ujian terlebih dahulu sebelum keluar.", "warning");
        return;
      }
      if (fbAuth && state.role === "teacher") {
        try { await signOut(fbAuth); } catch (e) {}
      }
      state.role = null;
      state.currentUser = null;
      state.activeMenu = "dashboard";
      showToast("Anda telah keluar dari sesi.", "info");
      renderApp();
    }

                <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Tambah Siswa

      document.getElementById("btn-run-import-std").onclick = async () => {
        const fileInput = document.getElementById("imp-std-file");
        const clsId = document.getElementById("imp-std-class").value;
        const clsObj = state.data.classes.find(c => c.id === clsId);
        if (!fileInput.files || !fileInput.files[0]) {
          showToast("Pilih file spreadsheet terlebih dahulu.", "warning");
          return;
        }
        try {
          const buf = await fileInput.files[0].arrayBuffer();
          const wb = window.XLSX.read(buf, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = window.XLSX.utils.sheet_to_json(sheet);
          let imported = 0;
          for (const r of rows) {
            const name = String(r.Nama || r.nama || r.Name || "").trim();
            if (!name) continue;
            const nis = String(r.NIS || r.nis || `2026${100 + imported}`).trim();
            const waliRaw = String(r.BimbinganWali || r.bimbingan_wali || r.Wali || "").toLowerCase();
            const payload = {
              nis,
              classId: clsId,
              className: clsObj ? clsObj.name : "-",
              name,
              gender: String(r.JK || r.jk || "L").toUpperCase().startsWith("P") ? "P" : "L",
              username: String(r.Username || r.username || nis).trim(),
              password: String(r.Password || r.password || "12345").trim(),
              isWaliGuidance: waliRaw === "ya" || waliRaw === "true" || waliRaw === "1"
            };
            await dbSaveDoc("students", null, payload);
            imported++;
          }
          closeModal();
          showToast(`Berhasil mengimpor ${imported} data siswa!`, "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file import: " + err.message, "error");
        }
      };
    }

    // MODUL 6: DAFTAR HADIR (AUTO PERTEMUAN BERURUTAN PER HARI & JAM YANG SAMA)
    // =========================================================================
    function getAvailableSlotsForClassAndDate(classId, dateStr) {
      const dayName = getDayNameIndo(dateStr);
      const matched = state.data.schedules
        .filter(s => s.classId === classId && s.day === dayName)
        .map(s => s.timeSlot);
      if (matched.length > 0) return matched;
      const anyClassSlots = state.data.schedules
        .filter(s => s.classId === classId)
        .map(s => s.timeSlot);
      if (anyClassSlots.length > 0) return Array.from(new Set(anyClassSlots));
      return ["Jam Reguler"];
    }

    function computeAutoMeetingNumber(classId, dateStr, timeSlot) {
      if (!classId || !dateStr) return 1;
      const effectiveSlot = timeSlot || getAvailableSlotsForClassAndDate(classId, dateStr)[0] || "Jam Reguler";
      const exactKey = `${classId}_${dateStr}_${effectiveSlot}`;
      if (state.data.attendance[exactKey]) {
        return Number(state.data.attendance[exactKey].meetingNo || 1);
      }
      // Cari pertemuan sebelumnya pada kelas yang sama, hari dalam pekan yang sama (misal Kamis), dan jam pelajaran yang sama
      const targetDay = getDayNameIndo(dateStr);
      const priorSessions = Object.values(state.data.attendance).filter(att => {
        if (att.classId !== classId) return false;
        const attDay = getDayNameIndo(att.date);
        const attSlot = att.timeSlot || "Jam Reguler";
        return attDay === targetDay && attSlot === effectiveSlot && String(att.date) < String(dateStr);
      });

      if (priorSessions.length === 0) {
        return 1;
      }
      const maxPrior = priorSessions.reduce((maxVal, item) => Math.max(maxVal, Number(item.meetingNo || 0)), 0);
      return Math.max(priorSessions.length + 1, maxPrior + 1);
    }

    function syncAttendanceContext(classId, dateStr, timeSlot = "") {
      const slots = getAvailableSlotsForClassAndDate(classId, dateStr);
      const chosenSlot = (timeSlot && slots.includes(timeSlot)) ? timeSlot : slots[0];
      state.selectedClassFilter = classId;
      state.attendanceDate = dateStr;
      state.attendanceTimeSlot = chosenSlot;
      state.attendanceMeetingNo = computeAutoMeetingNumber(classId, dateStr, chosenSlot);
    }

        records[st.id] = {

      const docKey = `${classId}_${dateStr}_${timeSlot}`;
      const payload = {
        classId,
        className: clsObj ? clsObj.name : "-",
        date: dateStr,
        timeSlot,
        meetingNo,
        records

    function computeFinalGrade(g) {
      if (!g) return 0;
      const vals = [g.tugas, g.uh, g.sts, g.sas, g.cbtScore]
        .map(v => Number(v))
        .filter(v => !Number.isNaN(v) && v > 0);
      if (vals.length === 0) return 0;
      const sum = vals.reduce((a, b) => a + b, 0);
      return Math.round((sum / vals.length) * 10) / 10;
    }

    async function saveAllGrades(classId) {
      const classStudents = state.data.students.filter(s => s.classId === classId);
      const kktpVal = getKktpForClass(classId);
      try {
        for (const st of classStudents) {
          const tugas = Number(document.getElementById(`grd_tugas_${st.id}`)?.value || 0);
          const uh = Number(document.getElementById(`grd_uh_${st.id}`)?.value || 0);
          const sts = Number(document.getElementById(`grd_sts_${st.id}`)?.value || 0);
          const sas = Number(document.getElementById(`grd_sas_${st.id}`)?.value || 0);
          const cbtScore = Number(document.getElementById(`grd_cbt_${st.id}`)?.value || 0);
          const docId = `${classId}_${st.id}`;
          const base = { classId, studentId: st.id, studentName: st.name, nis: st.nis, tugas, uh, sts, sas, cbtScore };
          const finalScore = computeFinalGrade(base);
          base.finalScore = finalScore;
          base.status = finalScore >= kktpVal ? "Tuntas" : "Remedial";
          await dbSaveDoc("grades", docId, base, true);
        }
        showToast("Seluruh nilai siswa berhasil disimpan!", "success");
        renderApp();
      } catch (err) {
        showToast("Gagal menyimpan buku nilai: " + err.message, "error");
      }
    }

    async function syncCbtScoresToGrades(classId) {
      const classStudents = state.data.students.filter(s => s.classId === classId);
      const allSubs = Object.values(state.data.cbt_submissions);
      let synced = 0;
      try {
        for (const st of classStudents) {
          const studentSubs = allSubs.filter(sub => sub.studentId === st.id);
          if (studentSubs.length > 0) {
            const avgCbt = Math.round(studentSubs.reduce((acc, item) => acc + Number(item.totalScore || 0), 0) / studentSubs.length);
            const docId = `${classId}_${st.id}`;
            const prev = state.data.grades[docId] || { classId, studentId: st.id, studentName: st.name, nis: st.nis, tugas: 0, uh: 0, sts: 0, sas: 0 };
            const updated = { ...prev, cbtScore: avgCbt };
            updated.finalScore = computeFinalGrade(updated);
            updated.status = updated.finalScore >= getKktpForClass(classId) ? "Tuntas" : "Remedial";
            await dbSaveDoc("grades", docId, updated, true);
            synced++;
          }
        }
        showToast(synced > 0 ? `Berhasil menarik skor CBT untuk ${synced} siswa!` : "Belum ada hasil ujian CBT untuk kelas ini.", synced > 0 ? "success" : "info");
        renderApp();
      } catch (err) {
        showToast("Gagal menarik nilai CBT: " + err.message, "error");
      }
    }

    // --- Parser & Modal Upload / Copy-Paste Soal Massal ---
    function parsePastedQuestionsText(rawText) {
      const blocks = String(rawText || "")
        .replace(/\r\n/g, "\n")
        .split(/\n\s*\n+/)
        .map(b => b.trim())
        .filter(Boolean);

      const parsed = [];
      for (const block of blocks) {
        const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
        if (lines.length === 0) continue;

        let type = "PG";
        let weight = 10;
        let key = "";
        const options = [];
        const pairs = [];
        const questionLines = [];

        for (const line of lines) {
          if (/^TIPE\s*:/i.test(line)) {
            const val = line.replace(/^TIPE\s*:/i, "").trim().toUpperCase().replace(/\s+/g, "_");
            if (QUESTION_TYPE_LABELS[val]) type = val;
          } else if (/^BOBOT\s*:/i.test(line)) {
            weight = Number(line.replace(/^BOBOT\s*:/i, "").trim()) || 10;
          } else if (/^(KUNCI|JAWABAN)\s*:/i.test(line)) {
            key = line.replace(/^(KUNCI|JAWABAN)\s*:/i, "").trim();
          } else if (/^[A-E][\.\)]\s+/i.test(line)) {
            options.push(line.replace(/^[A-E][\.\)]\s+/i, "").trim());
          } else if (line.includes("->") || line.includes("=>")) {
            const sep = line.includes("->") ? "->" : "=>";
            const parts = line.split(sep);
            if (parts.length >= 2) {
              pairs.push({ left: parts[0].replace(/^\d+[\.\)]\s*/, "").trim(), right: parts[1].trim() });
            }
          } else {
            questionLines.push(line.replace(/^\d+[\.\)]\s*/, ""));
          }
        }

        const qText = questionLines.join(" ").trim();
        if (!qText) continue;

        if (pairs.length >= 2) {
          type = "MENJODOHKAN";
          parsed.push({ type, questionText: qText, pairs, scoreWeight: weight });
        } else if (options.length >= 2) {
          if (key.includes(",")) type = "PG_KOMPLEKS";
          const finalKey = type === "PG_KOMPLEKS"
            ? key.toUpperCase().split(",").map(s => s.trim()).filter(Boolean)
            : (key.toUpperCase().charAt(0) || "A");
          parsed.push({ type, questionText: qText, options, correctAnswer: finalKey, scoreWeight: weight });
        } else if (/^(benar|salah)$/i.test(key)) {
          type = "BENAR_SALAH";
          parsed.push({ type, questionText: qText, options: ["Benar", "Salah"], correctAnswer: /^benar$/i.test(key) ? "Benar" : "Salah", scoreWeight: weight });
        } else if (type === "ESSAY" || !key) {
          type = "ESSAY";
          parsed.push({ type, questionText: qText, correctAnswer: key || "Dikoreksi manual", scoreWeight: weight });
        } else {
          type = "ISIAN_SINGKAT";
          parsed.push({ type, questionText: qText, correctAnswer: key, scoreWeight: weight });
        }
      }
      return parsed;
    }

          <div id="bulk-preview-box" class="p-3.5 rounded-2xl bg-[#EFF9F4] border border-emerald-200 text-xs hidden space-y-2 max-h-44 overflow-y-auto"></div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="window.appActions.closeModal()" class="px-5 py-2.5 rounded-full bg-blush text-taupe font-bold text-xs">Batal</button>
            <button type="button" id="btn-save-bulk-q" class="px-6 py-2.5 rounded-full bg-coral hover:bg-coralDark text-white font-extrabold text-xs shadow-pill">Simpan Semua Soal</button>
          </div>
        </div>
      `, "max-w-2xl");

      const renderPreview = (items) => {
        parsedBatch = items;
        const box = document.getElementById("bulk-preview-box");
        box.classList.remove("hidden");
        if (items.length === 0) {
          box.innerHTML = `<span class="text-rose-600 font-bold">Tidak ada soal valid yang terdeteksi. Periksa kembali format teks/file.</span>`;
          return;
        }
        box.innerHTML = `
          <div class="font-extrabold text-emerald-800">Terdeteksi ${items.length} Butir Soal Siap Simpan:</div>
          ${items.map((it, idx) => `
            <div class="p-2 rounded-xl bg-white border border-emerald-100">
              <b>${idx + 1}. [${it.type}]</b> ${escapeHtml(it.questionText.slice(0, 90))}...
            </div>
          `).join("")}
        `;
      };

      const tabPaste = document.getElementById("bulk-tab-paste");
      const tabFile = document.getElementById("bulk-tab-file");
      const panelPaste = document.getElementById("bulk-panel-paste");
      const panelFile = document.getElementById("bulk-panel-file");

      tabPaste.onclick = () => {
        tabPaste.className = "py-2 rounded-full text-xs font-extrabold bg-salmon text-white shadow-sm";
        tabFile.className = "py-2 rounded-full text-xs font-extrabold text-taupe";
        panelPaste.classList.remove("hidden");
        panelFile.classList.add("hidden");
      };
      tabFile.onclick = () => {
        tabFile.className = "py-2 rounded-full text-xs font-extrabold bg-salmon text-white shadow-sm";
        tabPaste.className = "py-2 rounded-full text-xs font-extrabold text-taupe";
        panelFile.classList.remove("hidden");
        panelPaste.classList.add("hidden");
      };

      document.getElementById("btn-parse-paste").onclick = () => {
        const text = document.getElementById("bulk-paste-area").value;
        renderPreview(parsePastedQuestionsText(text));
      };

      document.getElementById("bulk-file-input").onchange = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.name.toLowerCase().endsWith(".txt")) {
          const txt = await file.text();
          renderPreview(parsePastedQuestionsText(txt));
          return;
        }
        const buf = await file.arrayBuffer();
        const wb = window.XLSX.read(buf, { type: "array" });
        const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        const items = [];
        for (const r of rows) {
          const qText = String(r.Pertanyaan || r.pertanyaan || "").trim();
          if (!qText) continue;
          const rawType = String(r.Tipe || r.tipe || "PG").toUpperCase().trim().replace(/\s+/g, "_");
          const type = QUESTION_TYPE_LABELS[rawType] ? rawType : "PG";
          const weight = Number(r.Bobot || r.bobot || 10);
          const key = String(r.Kunci || r.kunci || "").trim();
          if (type === "PG" || type === "PG_KOMPLEKS") {
            const opts = [r.OpsiA, r.OpsiB, r.OpsiC, r.OpsiD].map(v => String(v || "").trim()).filter(Boolean);
            items.push({
              type,
              questionText: qText,
              options: opts,
              correctAnswer: type === "PG_KOMPLEKS" ? key.toUpperCase().split(",").map(s => s.trim()) : key.toUpperCase().charAt(0),
              scoreWeight: weight
            });
          } else if (type === "BENAR_SALAH") {
            items.push({ type, questionText: qText, options: ["Benar", "Salah"], correctAnswer: /^benar$/i.test(key) ? "Benar" : "Salah", scoreWeight: weight });
          } else {
            items.push({ type, questionText: qText, correctAnswer: key, scoreWeight: weight });
          }
        }
        renderPreview(items);
      };

      document.getElementById("btn-save-bulk-q").onclick = async () => {
        if (parsedBatch.length === 0) {
          const pasteTxt = document.getElementById("bulk-paste-area")?.value || "";
          if (pasteTxt.trim()) parsedBatch = parsePastedQuestionsText(pasteTxt);
        }
        if (parsedBatch.length === 0) {
          showToast("Belum ada soal yang siap disimpan.", "warning");
          return;
        }
        try {
          for (const item of parsedBatch) {
            await dbSaveDoc("cbt_questions", null, { examId, ...item });
          }
          closeModal();
          showToast(`Berhasil menambahkan ${parsedBatch.length} butir soal!`, "success");
          renderApp();
        } catch (err) {
          showToast("Gagal menyimpan soal massal: " + err.message, "error");
        }
      };
    }

        ? `<tr><td colspan="7" style="text-align:center;">Belum ada data siswa.</td></tr>`
        : classStudents.map((st, idx) => {
            let h = 0, s = 0, i = 0, a = 0;

              const code = sess.records?.[st.id]?.status;
              if (code === "H") h++; else if (code === "S") s++; else if (code === "I") i++; else if (code === "A") a++;
            });
            const tot = h + s + i + a;
            const pct = tot > 0 ? Math.round((h / tot) * 100) : 100;
            return `
              <tr>
                <td style="text-align:center;">${idx + 1}</td>
                <td>${escapeHtml(st.name)}</td>
                <td style="text-align:center;">${h}</td>

                <td style="text-align:center;">${a}</td>
                <td style="text-align:center;"><b>${pct}%</b></td>

    function isExamForStudentClass(exam, student) {
      if (!exam || !student) return false;
      const targetIds = Array.isArray(exam.targetClassIds) ? exam.targetClassIds.filter(Boolean) : [];
      const targetNames = Array.isArray(exam.targetClassNames) ? exam.targetClassNames.filter(Boolean) : [];

      const studentClassId = String(student.classId || "").trim();
      const studentClassName = String(student.className || "").trim().toLowerCase();

      if (studentClassId && targetIds.includes(studentClassId)) {
        return true;
      }

      if (studentClassName) {
        if (targetNames.some(n => String(n).trim().toLowerCase() === studentClassName)) {
          return true;
        }
        const matchedTargetClass = state.data.classes.some(
          c => targetIds.includes(c.id) && String(c.name || "").trim().toLowerCase() === studentClassName
        );
        if (matchedTargetClass) {
          return true;
        }
      }

      return false;
    }

    function confirmStartStudentExam(examId) {
      const ex = state.data.cbt_exams.find(e => e.id === examId);
      if (!ex) return;
      const questions = state.data.cbt_questions.filter(q => q.examId === examId);
      if (questions.length === 0) {
        showToast("Soal untuk paket ujian ini belum tersedia.", "warning");
        return;
      }

      openModal("Konfirmasi Mulai Ujian CBT", `
        <div class="space-y-4 text-xs">
          <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-900 space-y-1.5">

              <li>Ujian berjalan dalam mode layar penuh (Fullscreen).</li>
              <li>Membuka tab baru, berpindah aplikasi, atau keluar fullscreen akan tercatat sebagai pelanggaran.</li>
              <li>Jika pelanggaran mencapai <b>${ex.maxViolations || 3} kali</b>, ujian otomatis terkunci dan dikirim.</li>
            </ul>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="window.appActions.closeModal()" class="px-5 py-2.5 rounded-full bg-blush text-taupe font-bold">Batal</button>
            <button type="button" id="btn-launch-cbt" class="px-6 py-2.5 rounded-full bg-coral hover:bg-coralDark text-white font-extrabold shadow-pill">Saya Mengerti, Mulai Sekarang</button>
          </div>
        </div>
      `, "max-w-md");

      document.getElementById("btn-launch-cbt").onclick = () => {
        closeModal();
        try {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        } catch (e) {}

        const ordered = ex.randomizeQuestions
          ? [...questions].sort(() => Math.random() - 0.5)
          : [...questions];

        state.activeExamSession = {
          exam: ex,
          questions: ordered,
          currentIndex: 0,
          answers: {},
          violations: 0,
          violationLogs: [],
          remainingSeconds: Number(ex.durationMinutes || 60) * 60,
          timerId: null
        };

        startExamSecurityListeners();
        renderApp();
      };
    }

    let examVisibilityHandler = null;
    let examBlurHandler = null;
    let examCopyHandler = null;

    function startExamSecurityListeners() {
      stopExamSecurityListeners();
      const sess = state.activeExamSession;
      if (!sess) return;

      sess.timerId = setInterval(() => {
        if (!state.activeExamSession) return;
        state.activeExamSession.remainingSeconds--;
        const timerEl = document.getElementById("cbt-live-timer");
        if (timerEl) {
          const m = Math.floor(Math.max(0, state.activeExamSession.remainingSeconds) / 60);
          const s = Math.max(0, state.activeExamSession.remainingSeconds) % 60;
          timerEl.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }
        if (state.activeExamSession.remainingSeconds <= 0) {
          submitActiveStudentExam(false, "Waktu ujian habis.");
        }
      }, 1000);

      const recordViolation = (reason) => {
        if (!state.activeExamSession) return;
        state.activeExamSession.violations++;
        state.activeExamSession.violationLogs.push(`${new Date().toLocaleTimeString()} - ${reason}`);
        const maxV = Number(state.activeExamSession.exam.maxViolations || 3);
        const count = state.activeExamSession.violations;

        const badge = document.getElementById("cbt-violation-badge");
        if (badge) badge.textContent = `Pelanggaran: ${count}/${maxV}`;

        if (count >= maxV) {
          submitActiveStudentExam(true, `Batas pelanggaran tercapai (${count}/${maxV}): ${reason}`);
        } else {
          showToast(`PERINGATAN (${count}/${maxV}): ${reason}! Ujian akan terkunci jika mencapai batas.`, "error");
        }
      };

      examVisibilityHandler = () => {
        if (document.hidden) recordViolation("Meninggalkan tab ujian");
      };
      examBlurHandler = () => {
        recordViolation("Berpindah jendela / fokus layar hilang");
      };
      examCopyHandler = (e) => {
        e.preventDefault();
        showToast("Copy/Paste dinonaktifkan selama ujian.", "warning");
      };

      document.addEventListener("visibilitychange", examVisibilityHandler);
      window.addEventListener("blur", examBlurHandler);
      document.addEventListener("copy", examCopyHandler);
      document.addEventListener("cut", examCopyHandler);
      document.addEventListener("contextmenu", examCopyHandler);
    }

    function stopExamSecurityListeners() {
      if (state.activeExamSession?.timerId) {
        clearInterval(state.activeExamSession.timerId);
      }
      if (examVisibilityHandler) document.removeEventListener("visibilitychange", examVisibilityHandler);
      if (examBlurHandler) window.removeEventListener("blur", examBlurHandler);
      if (examCopyHandler) {
        document.removeEventListener("copy", examCopyHandler);
        document.removeEventListener("cut", examCopyHandler);
        document.removeEventListener("contextmenu", examCopyHandler);
      }
      examVisibilityHandler = null;
      examBlurHandler = null;
      examCopyHandler = null;
    }

    function renderActiveExamRoom() {
      const sess = state.activeExamSession;
      const q = sess.questions[sess.currentIndex];
      const maxV = Number(sess.exam.maxViolations || 3);
      const mins = Math.floor(sess.remainingSeconds / 60);
      const secs = sess.remainingSeconds % 60;

      return `
        <div class="min-h-screen w-full bg-blush flex flex-col select-none">
          <!-- Top Bar Ruang Ujian -->
          <div class="bg-espresso text-white px-4 sm:px-8 py-3.5 sticky top-0 z-40 shadow-md">
            <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div>
                <div class="font-extrabold text-sm">${escapeHtml(sess.exam.title)}</div>
                <div class="text-[11px] text-white/75">${escapeHtml(state.currentUser.name)} • ${escapeHtml(state.currentUser.className)}</div>
              </div>
              <div class="flex items-center gap-3">
                <span id="cbt-violation-badge" class="px-3 py-1.5 rounded-full bg-rose-600 text-white text-xs font-extrabold">
                  Pelanggaran: ${sess.violations}/${maxV}
                </span>
                <span id="cbt-live-timer" class="px-4 py-1.5 rounded-full bg-amber-400 text-espresso font-mono font-extrabold text-sm">
                  ${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}
                </span>
              </div>
            </div>
          </div>

          <div class="max-w-6xl w-full mx-auto px-4 sm:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
            <!-- Area Soal -->
            <div class="lg:col-span-8 bg-white rounded-[28px] p-6 shadow-clay border border-roseBorder flex flex-col justify-between space-y-6">
              <div class="space-y-4">
                <div class="flex items-center justify-between">
                  <span class="px-3.5 py-1 rounded-full bg-peach text-coralDark text-xs font-extrabold">Soal No. ${sess.currentIndex + 1} dari ${sess.questions.length}</span>
                  <span class="text-[11px] font-bold text-taupe">${QUESTION_TYPE_LABELS[q.type] || q.type}</span>
                </div>

                <p class="text-sm sm:text-base font-bold text-espresso leading-relaxed">${escapeHtml(q.questionText)}</p>

                <!-- Input Jawaban Sesuai 6 Tipe Soal -->
                <div class="pt-2 space-y-2.5">
                  ${renderStudentQuestionInput(q, sess.answers[q.id])}
                </div>
              </div>

              <!-- Navigasi Prev / Next / Submit -->
              <div class="pt-4 border-t border-roseBorder flex items-center justify-between gap-3">
                <button type="button" ${sess.currentIndex === 0 ? "disabled" : ""} onclick="window.appActions.navExamQuestion(${sess.currentIndex - 1})" class="px-5 py-2.5 rounded-full bg-blush disabled:opacity-40 text-espresso font-extrabold text-xs">
                  ← Sebelumnya
                </button>
                ${sess.currentIndex < sess.questions.length - 1 ? `
                  <button type="button" onclick="window.appActions.navExamQuestion(${sess.currentIndex + 1})" class="px-6 py-2.5 rounded-full bg-periwinkleDark text-white font-extrabold text-xs shadow-sm">
                    Selanjutnya →
                  </button>
                ` : `
                  <button type="button" onclick="window.appActions.confirmFinishStudentExam()" class="px-6 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-pill">
                    ✓ Selesai & Kirim Jawaban
                  </button>
                `}
              </div>
            </div>

            <!-- Panel Nomor Soal -->
            <div class="lg:col-span-4 bg-white rounded-[24px] p-5 shadow-clay border border-roseBorder space-y-4 h-fit">
              <div class="font-extrabold text-xs uppercase tracking-wider text-taupe">Navigasi Nomor Soal</div>
              <div class="grid grid-cols-5 gap-2">
                ${sess.questions.map((item, idx) => {
                  const answered = sess.answers[item.id] !== undefined && sess.answers[item.id] !== "" && (!Array.isArray(sess.answers[item.id]) || sess.answers[item.id].length > 0);
                  const isCurrent = idx === sess.currentIndex;
                  return `
                    <button type="button" onclick="window.appActions.navExamQuestion(${idx})" class="h-10 rounded-xl font-extrabold text-xs border transition ${
                      isCurrent
                        ? "bg-salmon text-white border-salmon shadow-sm"
                        : answered
                          ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                          : "bg-blush text-taupe border-roseBorder"
                    }">
                      ${idx + 1}
                    </button>
                  `;
                }).join("")}
              </div>
              <button type="button" onclick="window.appActions.confirmFinishStudentExam()" class="w-full py-3 rounded-full bg-coral hover:bg-coralDark text-white font-extrabold text-xs shadow-pill transition">
                Kumpulkan Ujian Sekarang
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderStudentQuestionInput(q, currentAns) {
      if (q.type === "PG") {
        const letters = ["A", "B", "C", "D", "E"];
        return (q.options || []).map((opt, idx) => {
          const letChar = letters[idx] || String(idx + 1);
          const selected = currentAns === letChar;
          return `
            <button type="button" onclick="window.appActions.setStudentAnswer('${q.id}', '${letChar}')" class="w-full text-left p-3.5 rounded-2xl border-2 transition flex items-center gap-3 ${
              selected ? "border-salmon bg-peach/50 font-extrabold" : "border-roseBorder bg-blush/40 hover:bg-blush"
            }">
              <span class="w-7 h-7 rounded-full ${selected ? "bg-salmon text-white" : "bg-white text-espresso"} font-extrabold text-xs flex items-center justify-center shrink-0">${letChar}</span>
              <span class="text-xs sm:text-sm">${escapeHtml(opt)}</span>
            </button>
          `;
        }).join("");
      }

      if (q.type === "PG_KOMPLEKS") {
        const letters = ["A", "B", "C", "D", "E"];
        const arr = Array.isArray(currentAns) ? currentAns : [];
        return (q.options || []).map((opt, idx) => {
          const letChar = letters[idx] || String(idx + 1);
          const checked = arr.includes(letChar);
          return `
            <button type="button" onclick="window.appActions.toggleMultiAnswer('${q.id}', '${letChar}')" class="w-full text-left p-3.5 rounded-2xl border-2 transition flex items-center gap-3 ${
              checked ? "border-periwinkleDark bg-[#F6F2FE] font-extrabold" : "border-roseBorder bg-blush/40 hover:bg-blush"
            }">
              <span class="w-6 h-6 rounded-lg ${checked ? "bg-periwinkleDark text-white" : "bg-white border border-roseBorder"} text-xs font-extrabold flex items-center justify-center shrink-0">${checked ? "✓" : letChar}</span>
              <span class="text-xs sm:text-sm">${escapeHtml(opt)}</span>
            </button>
          `;
        }).join("");
      }

      if (q.type === "BENAR_SALAH") {
        return ["Benar", "Salah"].map(val => {
          const selected = currentAns === val;
          return `
            <button type="button" onclick="window.appActions.setStudentAnswer('${q.id}', '${val}')" class="w-full text-left p-3.5 rounded-2xl border-2 transition font-extrabold text-xs sm:text-sm ${
              selected ? "border-salmon bg-peach/50 text-coralDark" : "border-roseBorder bg-blush/40"
            }">
              ${val}
            </button>
          `;
        }).join("");
      }

      if (q.type === "MENJODOHKAN") {
        const pairs = q.pairs || [];
        const rightChoices = pairs.map(p => p.right);
        const ansObj = (currentAns && typeof currentAns === "object") ? currentAns : {};
        return pairs.map((p, idx) => `
          <div class="p-3 rounded-2xl bg-blush/50 border border-roseBorder grid grid-cols-1 sm:grid-cols-2 gap-2 items-center text-xs">
            <div class="font-bold text-espresso">${idx + 1}. ${escapeHtml(p.left)}</div>
            <select onchange="window.appActions.setMatchAnswer('${q.id}', ${idx}, this.value)" class="px-3 py-2 rounded-xl border border-roseBorder bg-white font-bold">
              <option value="">-- Pilih Pasangan --</option>
              ${rightChoices.map(rc => `<option value="${escapeHtml(rc)}" ${ansObj[idx] === rc ? "selected" : ""}>${escapeHtml(rc)}</option>`).join("")}
            </select>
          </div>
        `).join("");
      }

      if (q.type === "ISIAN_SINGKAT") {
        return `
          <input type="text" value="${escapeHtml(currentAns || "")}" oninput="window.appActions.setStudentAnswer('${q.id}', this.value, false)" placeholder="Ketik jawaban singkat Anda di sini..." class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/40 text-sm font-bold" />
        `;
      }

      return `
        <textarea rows="5" oninput="window.appActions.setStudentAnswer('${q.id}', this.value, false)" placeholder="Tuliskan jawaban uraian lengkap Anda di sini..." class="w-full px-4 py-3 rounded-2xl border border-roseBorder bg-blush/40 text-sm">${escapeHtml(currentAns || "")}</textarea>
      `;
    }

    function navExamQuestion(idx) {
      if (!state.activeExamSession) return;
      if (idx >= 0 && idx < state.activeExamSession.questions.length) {
        state.activeExamSession.currentIndex = idx;
        renderApp();
      }
    }

    function setStudentAnswer(qId, val, shouldRender = true) {
      if (!state.activeExamSession) return;
      state.activeExamSession.answers[qId] = val;
      if (shouldRender) renderApp();
    }

    function toggleMultiAnswer(qId, letter) {
      if (!state.activeExamSession) return;
      const prev = Array.isArray(state.activeExamSession.answers[qId]) ? [...state.activeExamSession.answers[qId]] : [];
      const idx = prev.indexOf(letter);
      if (idx >= 0) prev.splice(idx, 1);
      else prev.push(letter);
      state.activeExamSession.answers[qId] = prev.sort();
      renderApp();
    }

    function setMatchAnswer(qId, pairIdx, val) {
      if (!state.activeExamSession) return;
      const prev = (state.activeExamSession.answers[qId] && typeof state.activeExamSession.answers[qId] === "object")
        ? { ...state.activeExamSession.answers[qId] }
        : {};
      prev[pairIdx] = val;
      state.activeExamSession.answers[qId] = prev;
    }

    function confirmFinishStudentExam() {
      openConfirmModal("Kirim Jawaban Ujian", "Pastikan seluruh soal telah dijawab. Setelah dikirim, ujian tidak dapat diubah lagi.", async () => {
        await submitActiveStudentExam(false, "Diselesaikan oleh peserta");
      });
    }

    async function submitActiveStudentExam(isLocked = false, reason = "") {
      const sess = state.activeExamSession;
      if (!sess) return;
      stopExamSecurityListeners();

      let earnedPoints = 0;
      let maxObjectivePoints = 0;

      for (const q of sess.questions) {
        const w = Number(q.scoreWeight || 10);
        const ans = sess.answers[q.id];
        if (q.type === "ESSAY") continue;
        maxObjectivePoints += w;

        if (q.type === "PG" || q.type === "BENAR_SALAH") {
          if (String(ans || "").trim().toLowerCase() === String(q.correctAnswer || "").trim().toLowerCase()) {
            earnedPoints += w;
          }
        } else if (q.type === "PG_KOMPLEKS") {
          const expected = Array.isArray(q.correctAnswer) ? [...q.correctAnswer].sort().join(",") : "";
          const actual = Array.isArray(ans) ? [...ans].sort().join(",") : "";
          if (expected && expected === actual) {
            earnedPoints += w;
          }
        } else if (q.type === "MENJODOHKAN") {
          const pairs = q.pairs || [];
          const ansObj = ans || {};
          let correctPairs = 0;
          pairs.forEach((p, idx) => {
            if (ansObj[idx] === p.right) correctPairs++;
          });
          if (pairs.length > 0) {
            earnedPoints += Math.round((correctPairs / pairs.length) * w);
          }
        } else if (q.type === "ISIAN_SINGKAT") {
          if (String(ans || "").trim().toLowerCase() === String(q.correctAnswer || "").trim().toLowerCase()) {
            earnedPoints += w;
          }
        }
      }

      const autoScore = maxObjectivePoints > 0 ? Math.round((earnedPoints / maxObjectivePoints) * 100) : 0;
      const student = state.currentUser;
      const subId = `${sess.exam.id}_${student.id}`;
      const payload = {
        examId: sess.exam.id,
        studentId: student.id,
        studentName: student.name,
        className: student.className,
        answers: sess.answers,
        autoScore,
        essayScore: 0,
        totalScore: autoScore,
        violationsCount: sess.violations,
        violationLogs: sess.violationLogs,
        status: isLocked ? "locked" : "submitted",
        note: reason,
        submittedAt: new Date().toISOString()
      };

      try {
        await dbSaveDoc("cbt_submissions", subId, payload, true);
      } catch (err) {
        console.error("Gagal mengirim jawaban CBT:", err);
      }

      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      } catch (e) {}

      state.activeExamSession = null;
      showToast(isLocked ? "Ujian dikunci otomatis karena pelanggaran!" : "Jawaban ujian berhasil dikirim!", isLocked ? "error" : "success");
      renderApp();
    }

    // =========================================================================
    // 12. RENDER ROOT & EKSPOR AKSI GLOBAL
    // =========================================================================
    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      if (!state.role) {
        root.innerHTML = renderLandingPage();
      } else if (state.role === "teacher") {
        root.innerHTML = renderTeacherLayout();
        if (state.activeMenu === "settings") {
          bindSettingsForm();
        }
      } else if (state.role === "student") {
        root.innerHTML = renderStudentCbtView();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    window.appActions = {
      openAuthModal,
      handleLogout,
      closeModal,
      openMobileDrawer,
      setMenu: (menuId) => {
        state.activeMenu = menuId;
        renderApp();
      },
      setSearchQuery: (val) => {
        state.searchQuery = val;
        renderApp();
      },
      setClassFilter: (val) => {
        state.selectedClassFilter = val;
        renderApp();
      },
      openClassModal,
      deleteClass,
      openStudentModal,
      openImportStudentsModal,
      downloadStudentTemplate,
      deleteStudent,
      printStudentCardsPdf,
      openScheduleModal,
      deleteSchedule,
      printSchedulesPdf,
      openJournalModal,
      deleteJournal,
      printJournalsPdf,
      setAttendanceTab: (tab) => {
        state.attendanceTab = tab;
        renderApp();
      },
      onAttendanceFilterChange: (classId, dateStr, timeSlot) => {
        syncAttendanceContext(classId, dateStr, timeSlot);
        renderApp();
      },
      markAllPresent,
      saveAttendanceSession,
      printAttendancePdf,
      setGradesTab: (tab) => {
        state.gradesTab = tab;
        renderApp();
      },
      saveAllGrades,
      syncCbtScoresToGrades,
      printGradesPdf,
      openWaliModal,
      deleteWaliLog,
      printWaliPdf,
      selectCbtExam,
      openExamModal,
      deleteExam,
      openQuestionModal,
      deleteQuestion,
      openBulkQuestionModal,
      downloadQuestionTemplate,
      selectMonitorExam,
      openGradeEssayModal,
      resetSubmission,
      printCbtResultsPdf,
      setReportFilters: (clsId, exmId) => {
        state.reportClassFilter = clsId;
        state.reportExamFilter = exmId;
        renderApp();
      },
      printAllReportsBundlePdf,
      confirmStartStudentExam,
      navExamQuestion,
      setStudentAnswer,
      toggleMultiAnswer,
      setMatchAnswer,
      confirmFinishStudentExam
    };

    // Inisialisasi Sesi Firebase Auth saat Mode Produksi (IS_PREVIEW === false)
    if (!IS_PREVIEW && fbAuth && isFirebaseConfigured) {
      onAuthStateChanged(fbAuth, async (user) => {
        if (user && !state.role) {
          state.role = "teacher";
          state.currentUser = { uid: user.uid, email: user.email };
          await dbLoadAllDataForTeacher();
        }
      });
    }

    renderApp();
  </script>
</body>
